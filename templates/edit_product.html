<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Edit Product - ShopKart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .back {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">

        <a href="/admin" class="back">
            ← Back to Admin Panel
        </a>

        <h1>✏️ Edit Product</h1>

        <form method="POST">

            <label>Product Name</label>
            <input type="text" name="name"
                   value="{{ product.name }}" required>

            <label>Price (₹)</label>
            <input type="number" name="price"
                   min="0.01" step="0.01"
                   value="{{ product.price }}" required>

            <label>Description</label>
            <textarea name="description"
                      required>{{ product.description }}</textarea>

            <label>Category</label>
            <input type="text" name="category"
                   value="{{ product.category }}" required>

            <label>Stock</label>
            <input type="number" name="stock"
                   min="0" step="1"
                   value="{{ product.stock }}" required>

            <label>Product Image Path</label>
            <input type="text" name="image"
                   value="{{ product.image }}" required>

            <button type="submit">Update Product</button>

        </form>

    </div>
</body>
</html>
