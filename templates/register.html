<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ShopKart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #ede9fe
            );
        }

        .register-box {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #2563eb;

            margin-bottom: 10px;
        }

        h2 {
            text-align: center;

            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-text {
            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .login-text a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .home {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;
        }

        .message {
            padding: 10px;

            margin-bottom: 15px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 6px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="register-box">


    <div class="logo">
        🛒 ShopKart
    </div>


    <h2>
        Create Your Account
    </h2>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Register Form -->

    <form
        action="/register"
        method="POST"
    >


        <div class="input-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                minlength="6"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>


    </form>


    <p class="login-text">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </p>


    <a
        href="/"
        class="home"
    >
        ← Back to Home
    </a>


</div>


</body>

</html>
