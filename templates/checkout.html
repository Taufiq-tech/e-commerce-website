<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopKart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            resize: vertical;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        🛒 ShopKart
    </div>

    <a href="/">
        Home
    </a>

</nav>


<div class="container">

    <div class="box">

        <h1>
            🛍️ Checkout
        </h1>

        <form method="POST">

            <label>
                Delivery Address
            </label>

            <textarea
                name="address"
                placeholder="Enter your complete delivery address..."
                required
            ></textarea>

            <button type="submit">
                Place Order 🎉
            </button>

        </form>

        <a
            href="/cart"
            class="back"
        >
            ← Back to Cart
        </a>

    </div>

</div>


</body>

</html>
