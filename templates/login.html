<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopKart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #ede9fe
                );
        }

        .login-container {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #2563eb;

            margin-bottom: 10px;
        }

        h2 {
            text-align: center;

            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            outline: none;

            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-text {
            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .register-text a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .home {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;
        }

        .message {
            padding: 10px;

            margin-bottom: 15px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 6px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🛒 ShopKart
    </div>


    <h2>
        Welcome Back
    </h2>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Login Form -->

    <form
        action="/login"
        method="POST"
    >


        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>


    </form>


    <p class="register-text">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>


    <a
        href="/"
        class="home"
    >
        ← Back to Home
    </a>


</div>


</body>

</html>
